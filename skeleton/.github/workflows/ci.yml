name: CI

# ARCHITECTURE.md §20: 이 CI 는 push 이후 도는 사후 안전망이다.
# 게이트는 push 전 로컬 검증(pytest·ruff·eslint·svelte-check·build)이다. CI 가 실패하면 되돌리거나 즉시 고친다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # 이 프로젝트는 Windows 와 macOS 에서 함께 개발한다.
    # Ubuntu 만 돌리면 OS 분기 버그(경로·인코딩·타임존·휠)를 영원히 못 잡는다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        # 테스트는 SQLite in-memory 사용 — 외부 DB 불필요 (§12)
        run: pytest -q

  # .ps1 은 Windows PowerShell 5.1 에서 파싱되어야 한다.
  # PS7 전용 문법(??, ?:, &&/||)이 섞이면 5.1 은 한 줄도 실행하지 못하고 죽는다.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check .ps1 syntax with Windows PowerShell 5.1
        shell: powershell # pwsh 가 아니라 5.1 이어야 의미가 있다
        # ⛔ 검사 로직을 여기 인라인으로 되돌리지 마라. Actions 는 이 스텝을 BOM 없는 UTF-8
        #    임시 파일로 쓰는데 5.1 은 그것을 ANSI 로 읽어 한글이 깨지고 따옴표 짝이 무너진다
        #    ("The string is missing the terminator"). 스크립트 파일은 BOM 을 달아 커밋한다.
        run: .\.github\scripts\check-ps1-syntax.ps1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # corepack 은 Node 25 부터 배포본에서 제거됐다. "lts/*"/"latest" 로 바꾸지 말 것.
          node-version: "24"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type check (svelte-check)
        run: pnpm check
      - name: Build (SvelteKit + vite)
        run: pnpm build
