[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16+: explicit separator for path lists (os = os.pathsep); omitting it emits a DeprecationWarning.
path_separator = os
# sqlalchemy.url is injected in alembic/env.py via app.config.get_settings().
# (alembic.ini must stay ASCII-only: configparser reads it with the OS locale encoding.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
